[build]
command = "npm run build"
publish = "dist"
functions = "netlify/functions"
[build.environment]
NODE_VERSION = "22"
[[redirects]]
from = "http://dixberfgruas.com.mx/*"
to = "https://dixberfgruas.com.mx/:splat"
status = 301
force = true
[[redirects]]
from = "http://www.dixberfgruas.com.mx/*"
to = "https://dixberfgruas.com.mx/:splat"
status = 301
force = true
[[redirects]]
from = "https://www.dixberfgruas.com.mx/*"
to = "https://dixberfgruas.com.mx/:splat"
status = 301
force = true
[[redirects]]
from = "/api/quote"
to = "/.netlify/functions/quote"
status = 200
[[redirects]]
from = "/aviso-de-privacidad/"
to = "/politica-de-privacidad/"
status = 301
[[headers]]
for = "/*"
[headers.values]
X-Content-Type-Options = "nosniff"
X-Frame-Options = "DENY"
Referrer-Policy = "strict-origin-when-cross-origin"
Permissions-Policy = "camera=(), microphone=(), geolocation=()"
Strict-Transport-Security = "max-age=31536000"
Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.google-analytics.com https://*.googletagmanager.com; font-src 'self'; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests"
[[headers]]
for = "/_astro/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
for = "/images/*"
[headers.values]
Cache-Control = "public, max-age=604800"
